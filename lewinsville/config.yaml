name: Lewinsville Portal
version: "0.3.8"
slug: lewinsville
description: The family's app for the house, with the Claude house assistant. Served at lewinsville.vip through the Cloudflared tunnel.
url: https://github.com/davidrlupton/Lewinsville
arch: [amd64]
startup: application
boot: auto
init: false
homeassistant_api: true
map:
  - share:rw
  - media:rw   # recorded sounds in /media/lewinsville/sounds, served to the speakers by HA's media source
# No host port on purpose: the only way in is the Cloudflare tunnel, which reaches the add-on by name
# (http://90b47cbd-lewinsville:3000) on the Supervisor network. That keeps Access the sole front door.
options:
  anthropic_api_key: ""
  claude_model: claude-opus-5-5
  claude_voice_model: claude-sonnet-5-5   # the spoken Teddy (/api/converse, called by the Teddy add-on)
  teddy_token: ""                         # shared secret with the Teddy add-on; same value in both
  people: []
  dev_user_email: ""
  # Dominion's all-in residential price in cents per kWh, for the Energy tab's dollar estimate. 0 hides it.
  energy_rate_cents: 14
schema:
  anthropic_api_key: password
  claude_model: str
  claude_voice_model: str?
  teddy_token: password?
  people:
    - email: email
      name: str
      role: list(owner|household|guest)
      theme: list(festival|slate)?
      wifi_only: bool?
      device: str?
  dev_user_email: str?
  energy_rate_cents: float?
