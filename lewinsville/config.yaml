name: Lewinsville Portal
version: "0.1.4"
slug: lewinsville
description: The family's app for the house, with the Claude house assistant. Served at lewinsville.vip through the Cloudflared tunnel.
url: https://github.com/davidrlupton/Lewinsville
arch: [amd64]
startup: application
boot: auto
init: false
homeassistant_api: true
# No host port on purpose: the only way in is the Cloudflare tunnel, which reaches the add-on by name
# (http://90b47cbd-lewinsville:3000) on the Supervisor network. That keeps Access the sole front door.
options:
  anthropic_api_key: ""
  claude_model: claude-opus-5-5
  people: []
  dev_user_email: ""
schema:
  anthropic_api_key: password
  claude_model: str
  people:
    - email: email
      name: str
      role: list(owner|household|guest)
  dev_user_email: str?
